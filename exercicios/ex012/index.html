<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos com HTML</title>
</head>
<body>
    <h1>Inserindo videos hospedados localmente</h1>
    <p>Este video está hospedado no meu próprio servidor</p>
   <video width="560" poster="imagem/capa.png" controls autoplay loop>
    <source src="midia/mebm.video.webm" type="video/mebm">
    <source src="midia/mp4.video.mp4" type="video/mp4">
    <source src="midia/m4v.video.mkv" type="video/mkv">
    <source src="midia/ovg.video.ogv" type="video/ovg">
    <p>seu navegador não tem compatibilidade com reproduções de videos. </p>
   </video>
   <h1>Inserindo videos do youtube</h1>
   <iframe width="560" height="315" src="https://www.youtube.com/embed/btbXk95PNgY?si=mrxsrxBYrPZC2Ydj" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
