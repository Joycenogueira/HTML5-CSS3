<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>links</title>
    <style>
        /*
        # = id
        . = class
        : = pseudo-class
        :: = pseudo-element
        > = clildren
        */
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        a{
            color: red;
            text-decoration: none;
            font-weight: bold;
        }
        a:visited{
            color: darkred;
        }
        a:hover{
            color: black;
            text-decoration: underline;
        }
        a:active{
            color: yellow;
        }
        .especial{
            background-color: rgb(163, 102, 102);
        }
        .especial::before{
            content: '⇒';
        }
        .especial::after{
            content:'⇐ ';
        }
    </style>
</head>
<body>
    <h1>Personalizando links</h1>
    <li><a href="https://repositorio.gustavoguanabara.github.io" target="_blank" class="especial">Repositório</a></li>
    <li><a href="https://youtube.com/cirsoemvideo/" target="_blank">Canal do youtube</a></li>
    <li><a href="https://www.cursoemvideo.com" target="_blank" class="especial">Site do Curso em vídeo</a></li>
</body>
</html>
